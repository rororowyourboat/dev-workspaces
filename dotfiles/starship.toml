# Minimal default Starship prompt for dev-workspaces containers.
# Personalize by bind-mounting your own over /etc/skel-dotfiles/starship.toml
# or by using `devcontainer up --dotfiles-repository <url>`. See README.
add_newline = true

[character]
success_symbol = "[\\$](bold green)"
error_symbol = "[\\$](bold red)"

[directory]
truncation_length = 4
truncate_to_repo = true

[cmd_duration]
min_time = 2000
